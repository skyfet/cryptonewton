<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Pay Terminal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 0;
      margin: 0;
      background: var(--tg-bg-color, #f6f6f6);
      color: var(--tg-text-color, #222);
    }
    .container { padding: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      cursor: pointer;
      background: var(--tg-button-color, #0077ff);
      color: var(--tg-button-text-color, #fff);
      border: none;
      border-radius: 6px;
    }
    .amounts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .amount {
      padding: 10px 15px;
      background: var(--tg-secondary-bg-color, #fff);
      border: 1px solid var(--tg-hint-color, #ccc);
      border-radius: 4px;
      cursor: pointer;
    }
    .amount.selected {
      background: var(--tg-button-color, #0077ff);
      color: var(--tg-button-text-color, #fff);
    }
    #inputAmount {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      display: none;
      border: 1px solid var(--tg-hint-color, #ccc);
      border-radius: 4px;
      background: var(--tg-secondary-bg-color, #fff);
      color: inherit;
    }
  </style>
</head>
<body>
  <div id="app" class="container"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    function applyTheme() {
      const params = tg.themeParams || {};
      const root = document.documentElement.style;
      root.setProperty('--tg-bg-color', params.bg_color || '#f6f6f6');
      root.setProperty('--tg-text-color', params.text_color || '#222');
      root.setProperty('--tg-hint-color', params.hint_color || '#ccc');
      root.setProperty('--tg-button-color', params.button_color || '#0077ff');
      root.setProperty('--tg-button-text-color', params.button_text_color || '#fff');
      root.setProperty('--tg-secondary-bg-color', params.secondary_bg_color || '#fff');
    }

    applyTheme();
    tg.onEvent('themeChanged', applyTheme);
    const app = document.getElementById('app');

    const amounts = [50,150,250,500,1000,2500];
    let selectedAmount = null;
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode') || 'buy';
    const toId = params.get('user_id');

    function renderStart() {
      tg.MainButton.hide();
      tg.BackButton.hide();
      app.innerHTML = `<button id="startBuy" class="btn">⭐ Купить звёзды</button>`;
      document.getElementById('startBuy').onclick = () => renderAmount();
    }

    function renderAmount() {
      tg.MainButton.hide();
      tg.BackButton.show();
      tg.offEvent('backButtonClicked');
      tg.onEvent('backButtonClicked', () => { window.location.search=''; });
      const recipientInfo = mode === 'gift' ? `<p>Получатель: <b>${toId}</b></p>` : '';
      app.innerHTML = `
        ${recipientInfo}
        <div class="amounts">
          ${amounts.map(a => `<div class="amount" data-val="${a}">${a}</div>`).join('')}
          <div class="amount" id="enter">Ввести</div>
        </div>
        <input type="number" id="inputAmount" placeholder="Ввести" min="1" max="250000" />
        <button id="confirmBtn" class="btn">Выбрать</button>`;

      document.querySelectorAll('.amount').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.amount').forEach(a => a.classList.remove('selected'));
          el.classList.add('selected');
          if(el.id === 'enter') {
            document.getElementById('inputAmount').style.display='block';
            selectedAmount = null;
          } else {
            document.getElementById('inputAmount').style.display='none';
            selectedAmount = parseInt(el.dataset.val,10);
          }
        });
      });
      document.getElementById('confirmBtn').onclick = () => confirmAmount();
    }

    function confirmAmount() {
      if(document.getElementById('inputAmount').style.display==='block') {
        selectedAmount = parseInt(document.getElementById('inputAmount').value,10);
      }
      if(!selectedAmount || selectedAmount < 1) return alert('Укажите сумму');
      const text = mode==='gift' ? `Подарить ${selectedAmount} ⭐` : `Купить ${selectedAmount} ⭐`;
      app.innerHTML = `<p>${text}</p>`;
      tg.MainButton.setText('Подтвердить');
      tg.MainButton.show();
      tg.offEvent('mainButtonClicked');
      tg.onEvent('mainButtonClicked', submit);
    }

    function submit() {
      const url = mode==='gift' ? '/gift' : '/purchase';
      const payload = mode==='gift' ? {
        from_id: tg.initDataUnsafe?.user?.id,
        to_id: parseInt(toId,10),
        amount: selectedAmount
      } : {
        user_id: tg.initDataUnsafe?.user?.id,
        amount: selectedAmount
      };
      tg.MainButton.showProgress();
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(r=>r.json())
        .then(d=>{
          if(d.ok){
            renderSuccess();
          } else {
            alert(d.error || 'Ошибка');
          }
        })
        .catch(()=>alert('Сетевой сбой'))
        .finally(()=>tg.MainButton.hideProgress());
    }

    function renderSuccess() {
      const text = mode==='gift' ? `Подарок отправлен ${toId}` : 'Звёзды успешно куплены';
      app.innerHTML = `<p>🎉 ${text}</p><button id="restart" class="btn">На главную</button>`;
      tg.MainButton.hide();
      tg.BackButton.hide();
      document.getElementById('restart').onclick=()=>{window.location.search='';};
    }

    if(mode==='gift' && toId){
      renderAmount();
    } else {
      renderStart();
    }
  </script>
</body>
</html>
